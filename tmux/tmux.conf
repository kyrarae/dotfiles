# A cross-platform, extensible terminal multiplexer.
# https://github.com/tmux/tmux

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # Enable undercurl
set -sa terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # Enable undercurl colors

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

set -g default-shell '/opt/Homebrew/bin/fish'

set -s escape-time 0                # Disable escape time delay
set -g mouse on                     # Enable mouse support
set -g detach-on-destroy off        # Don't exit from tmux when closing session
set -g history-limit 100000         # Set a larger scrollback
set -g status-position bottom       # Set status bar to bottom position
set -g base-index 1                 # Start numbering at 1
set -g renumber-windows on          # automatically renumber after closing
set -g allow-rename on              # Allow renaming of tmux windows
set -g set-clipboard on      	    # Use system clipboard
set -g display-time 500             # Set a shorter display time for messages
set -g status-interval 10           # Set status bar update interval

set-window-option -g xterm-keys on

# Enable ghostty features
set -s extended-keys on
set -as terminal-features 'xterm-ghostty:RGB:usstyle:extkeys'

# Key bindings
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/tmux.conf"

# Window Management
bind s split-window -h -c '#{pane_current_path}' \; unbind '"'
bind v split-window -v -c '#{pane_current_path}' \; unbind %
bind c new-window -c '#{pane_current_path}'

#bind x kill-window # skip "kill-window 1? (y/n)" prompt
bind x if-shell '[ $(tmux list-windows | wc -l) -eq 1 ]' "confirm-before -p 'Kill session? (y/n)' kill-window" "kill-window"

# Navigation
bind m choose-tree
bind k choose-session

bind C-x kill-pane # skip "kill-pane 1? (y/n)" prompt

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Session management
bind C-s command-prompt 'rename-session %%'
bind C-n new-session
# Create new session from current window
bind C-b command-prompt -p "New session name:" "new-session -d -s '%%'; move-window -t '%%:'; switch-client -t '%%'"

# Custom scripts
bind C-j display-popup -h 20% -w 20% -E "tmux-session-switcher"
bind C-p display-popup -h 70% -w 70% -E "tmux-snaglord"
bind C-o display-popup -E "tmux-zoxide-window"

bind g display-popup -h 95% -w 95% -d '#{pane_current_path}' -E lazygit

# File pickers
bind C-f display-popup -h 60% -w 60% -E "tmux-file-picker"
bind C-r display-popup -h 60% -w 60% -E "tmux-file-picker -d"
bind C-g display-popup -h 60% -w 60% -E "tmux-file-picker -g"
bind C-d display-popup -h 60% -w 60% -E "tmux-file-picker --zoxide --dir-only"
bind C-z display-popup -h 60% -w 60% -E "tmux-file-picker --zoxide"

# Status style
set -g status-bg '#313244'
set -g status-fg white
set -g status-left ' #[fg=green]#S '
set -g status-right '#[fg=green]%m-%d %H:%M '
set -g status-left-length 15
set -g status-right-length 15

# Window status style
set-window-option -g window-status-separator ""
set-window-option -g window-status-style fg=white,bg=#313244
set-window-option -g window-status-current-style fg=black,bg=green
set-window-option -g window-status-format "#[fg=#585b70,bg=#313244]▐#[fg=#313244,bg=#585b70]#I:#W#[fg=#585b70,bg=#313244]▌"
set-window-option -g window-status-current-format "#[fg=green,bg=#313244]▐#[fg=black,bg=green]#I:#W#[fg=green,bg=#313244]▌"

# Pane style
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_current_command} "
set -g pane-border-style fg=#595c6e #313244
set -g pane-active-border-style "fg=green,dim"

# Automatically toggle pane-border-status based on the number of panes
set-hook -g after-split-window 'if-shell -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set-hook -g after-kill-pane 'if-shell -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set-hook -g after-new-window 'if-shell -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set-hook -g session-created 'if-shell -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'
set-hook -g after-select-window 'if-shell -F "#{>:#{window_panes},1}" "setw pane-border-status top" "setw pane-border-status off"'

# Mode style
set -g mode-style "bg=#b4befe,fg=black"

# Message style
set -g message-style "bg=#b4befe,fg=black,bold"
set -g message-command-style "bg=#b4befe,fg=black,bold"

# Popup style
set -g popup-border-style "fg=#595c6e"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Initialize plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
