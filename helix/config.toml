theme = "no_background"

[editor]
#auto-save = true
auto-format = true
auto-completion = true
bufferline = "multiple"
color-modes = true
completion-replace = true
trim-trailing-whitespace = true
end-of-line-diagnostics = "hint"
cursorcolumn = false
cursorline = false
line-number = "relative"
mouse = true
#rulers = [80]
true-color = true

[editor.whitespace.render]
space = "none"
nbsp = "none"
tab = "none"
newline = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
tab = "→"
newline = "⏎"
tabpad = "·" # Tabs will look like "→···" (depending on tab width)

[editor.file-picker]
hidden = false
git-ignore = true
git-global = false

[editor.statusline]
left = [
    "mode",
    "spinner",
    "version-control",
    "spacer",
    "separator",
    "file-base-name",
    "read-only-indicator",
    "file-modification-indicator"
]
right = [
    "diagnostics",
    "workspace-diagnostics",
    "position",
    "total-line-numbers",
    "position-percentage",
    "file-encoding",
    "file-type"
]
separator = "|"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.cursor-shape]
insert = "bar"

[editor.indent-guides]
render = true
character = "┆" # Some characters that work well: "▏", "┆", "┊", "╎"
skip-levels = 0

[editor.soft-wrap]
enable = true
max-wrap = 10 # increase value to reduce forced mid-word wrapping
max-indent-retain = 40

[keys.normal]
D = ["ensure_selections_forward", "extend_to_line_end", "delete_selection"]
0 = "goto_line_start"
"$" = "goto_line_end"
"^" = "goto_first_nonwhitespace"
G = "goto_file_end"
V = ["select_mode", "extend_to_line_bounds"]
esc = ["collapse_selection", "keep_primary_selection"]
"Cmd-s" = ":write"
"C-y" = [":open %sh{yazi --chooser-file=/dev/stdout | tr -d '\\n'}", ":redraw", ":set mouse false", ":set mouse true"]

[keys.normal.space]
e = { w = ":write", c = ":bc", x = ":bco", l = ":toggle lsp.display-inlay-hints" }
q = ":quit"
